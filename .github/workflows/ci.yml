name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refuse hard-coded admin bootstrap
        run: |
          if test -f app/create_admin_user.py; then
            echo "Hard-coded admin creator must not be present"
            exit 1
          fi
      - run: pytest -q
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
          MONGO_DETAILS: mongodb://127.0.0.1:27017
          CORS_ORIGINS: http://localhost:5173
          TRUSTED_HOSTS: localhost,127.0.0.1,testserver
          COOKIE_SECURE: "false"
